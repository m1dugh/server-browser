# Default values for server-browser.

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# The chromium browser container. No image exists upstream that runs
# chromium headful on a bare X11 display without also bundling its own
# VNC/noVNC server (e.g. jlesage/chromium), which would conflict with
# xpra acting as the display server here. So this image is authored in
# this chart's own `image/` folder: alpine + chromium (apk) + xvfb, started
# with --remote-debugging-port=<port> (bound to loopback only -- see
# below) and nothing else listening on the display.
chromium:
  image:
    repository: ghcr.io/m1dugh/server-browser/chromium
    pullPolicy: IfNotPresent
    tag: latest

  # Chrome DevTools Protocol (remote debugging) port. Chromium >=M113
  # forces --remote-debugging-address back to 127.0.0.1 regardless of
  # what's requested, so this port is never actually bound on all
  # interfaces by chromium itself -- see socat below for how it's
  # actually exposed to the rest of the pod/cluster.
  debuggingPort: 9222

  # Virtual display resolution (Xvfb).
  display:
    width: 1920
    height: 1080
    depth: 24

  resources: {}
  securityContext: {}

  # Exposes the CDP debugger endpoint outside the pod: a socat sidecar
  # relaying 0.0.0.0:debuggingPort -> 127.0.0.1:debuggingPort inside the
  # pod (working around the chromium >=M113 CDP loopback-only
  # restriction -- see debuggingPort above), plus the Service and
  # optional HTTPRoute fronting it. Disabled by default -- the debugger
  # is opt-in per deployment.
  debug:
    enabled: false

    image:
      repository: alpine/socat
      pullPolicy: IfNotPresent
      tag: ""

    resources: {}
    securityContext: {}

    # Service exposing the debugging port (via the debug-fwd relay
    # above). Only takes effect when debug.enabled is also true -- the
    # port it exposes doesn't exist on the pod otherwise.
    service:
      type: ClusterIP
      port: 9222

    # Gateway API HTTPRoute exposing the CDP debugger endpoint (via
    # debug-fwd). Only takes effect when debug.enabled is also true.
    # Disabled/unset by default since this chart is cluster-agnostic
    # until integrated elsewhere -- set gatewayName/gatewayNamespace and
    # hostname to wire it up. Kept separate from xpra's own httpRoute
    # block so each can bind to a different gateway.
    httpRoute:
      enabled: false
      gatewayName: ""
      gatewayNamespace: ""
      sectionName: https
      hostname: ""

# The xpra sidecar. Shares the chromium container's X11 socket
# (/tmp/.X11-unix, via an emptyDir) and shadows its display, rather than
# starting/owning an application itself. Disabled by default -- enable
# it to get an interactive display of the chromium session.
xpra:
  enabled: false

  image:
    repository: ghcr.io/m1dugh/server-browser/xpra
    pullPolicy: IfNotPresent
    tag: latest

  # Port xpra's HTML5/TCP client listens on.
  port: 10000

  # Password protecting the xpra HTML5/websocket listener. When neither
  # is set, xpra runs passwordless (auth=allow). `password` sets it
  # directly (plaintext, rendered into the StatefulSet/values -- fine for
  # local testing, not recommended for anything checked into git).
  # `passwordSecretName`/`passwordSecretKey` instead point at a Secret
  # (e.g. materialized by an ExternalSecret); takes precedence over
  # `password` when both are set.
  auth:
    password: ""
    passwordSecretName: ""
    passwordSecretKey: password

  resources: {}
  securityContext: {}

  # Service exposing the xpra HTML5/TCP port. Only takes effect when
  # xpra.enabled is also true.
  service:
    type: ClusterIP
    port: 10000

  # Gateway API HTTPRoute exposing the xpra HTML5 UI. Only takes effect
  # when xpra.enabled is also true. Disabled/unset by default -- see
  # chromium.debug.httpRoute above; kept independent so xpra and the debugger
  # endpoint can bind to different gateways.
  httpRoute:
    enabled: false
    gatewayName: ""
    gatewayNamespace: ""
    sectionName: https
    hostname: ""

# Chromium's --user-data-dir (profile, cache, cookies, extensions, ...).
persistence:
  enabled: false
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
