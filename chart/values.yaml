# Default values for server-browser.

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

# The chromium browser container. No image exists upstream that runs
# chromium headful on a bare X11 display without also bundling its own
# VNC/noVNC server (e.g. jlesage/chromium), which would conflict with
# kasmvnc acting as the display server here. So this image is authored
# in this chart's own `chromium/` folder: alpine + chromium (apk),
# connecting as a plain X11 client to the display kasmvnc owns (see
# kasmvnc below) -- or, when kasmvnc is disabled, to its own Xvfb
# instead -- started with --remote-debugging-port=<port> (bound to
# loopback only -- see below) and nothing else listening on the
# display.
chromium:
  image:
    repository: ghcr.io/m1dugh/server-browser/chromium
    pullPolicy: IfNotPresent
    # Pinned to chromium/version.txt -- never `latest`: with IfNotPresent a
    # node keeps serving a stale cached `latest` after a rebuild.
    tag: 155.0.8059.84-r0

  # Chrome DevTools Protocol (remote debugging) port. Chromium >=M113
  # forces --remote-debugging-address back to 127.0.0.1 regardless of
  # what's requested, so this port is never actually bound on all
  # interfaces by chromium itself -- see nginx below for how it's
  # actually exposed to the rest of the pod/cluster.
  debuggingPort: 9222

  # Virtual display resolution (Xvfb).
  display:
    width: 1920
    height: 1080
    depth: 24

  resources: {}

  # CAP_SYS_RESOURCE lets chromium lower its renderers' oom_score_adj (it
  # logs "Failed to adjust OOM score of renderer ... Permission denied" on
  # every tab switch otherwise). The image entrypoint carries just this one
  # capability across its drop to the unprivileged chromium user. Override
  # with `{}` to run without it; the entrypoint falls back transparently.
  securityContext:
    capabilities:
      add:
        - SYS_RESOURCE

  # Exposes the CDP debugger endpoint outside the pod through the nginx
  # proxy (see `nginx` below), plus the Service and optional HTTPRoute
  # fronting it. Disabled by default -- the debugger is opt-in per
  # deployment.
  debug:
    enabled: false

    # Service exposing the debugger (targets nginx.debugPort). Only
    # takes effect when debug.enabled is also true.
    service:
      type: ClusterIP
      port: 9222

    # Gateway API HTTPRoute exposing the CDP debugger endpoint (via
    # nginx). Only takes effect when debug.enabled is also true.
    # Disabled/unset by default since this chart is cluster-agnostic
    # until integrated elsewhere -- set gatewayName/gatewayNamespace and
    # hostname to wire it up. Kept separate from kasmvnc's own httpRoute
    # block so each can bind to a different gateway.
    httpRoute:
      enabled: false
      gatewayName: ""
      gatewayNamespace: ""
      sectionName: https
      hostname: ""

# The kasmvnc sidecar. Owns the pod's X11 display (KasmVNC's own Xvnc,
# not Xvfb) rather than shadowing/attaching to one started elsewhere --
# the chromium container connects into THIS display as a plain X11
# client, sharing the X11 socket (/tmp/.X11-unix, via an emptyDir) the
# other way around from how the old xpra sidecar worked. Disabled by
# default -- enable it to get an interactive display of the chromium
# session.
kasmvnc:
  enabled: false

  image:
    repository: ghcr.io/m1dugh/server-browser/kasmvnc
    pullPolicy: IfNotPresent
    # Pinned to <kasmvnc/version.txt>-alpine<alpine version of the FROM line>.
    tag: 1.19.0-alpine3.23

  # Port KasmVNC's HTML5/websocket client listens on, on the pod's
  # loopback only and as plain HTTP/WS (hard-coded in the StatefulSet):
  # it is only reachable through nginx, which injects KasmVNC's internal
  # credential so users never authenticate against KasmVNC. There is
  # deliberately no KasmVNC auth option -- if authentication is ever
  # needed, it belongs in nginx.
  port: 6901

  resources: {}
  securityContext: {}

  # Service exposing the KasmVNC HTML5/websocket UI (targets
  # nginx.kasmvncPort). Only takes effect when kasmvnc.enabled is also
  # true.
  service:
    type: ClusterIP
    port: 6901

  # Gateway API HTTPRoute exposing the KasmVNC HTML5 UI. Only takes
  # effect when kasmvnc.enabled is also true. Disabled/unset by default
  # -- see chromium.debug.httpRoute above; kept independent so kasmvnc
  # and the debugger endpoint can bind to different gateways.
  httpRoute:
    enabled: false
    gatewayName: ""
    gatewayNamespace: ""
    sectionName: https
    hostname: ""

# Plain-HTTP (no TLS) nginx proxy sitting in front of both kasmvnc and the
# CDP debugger; rendered when either is enabled. Its config is the
# `<fullname>-nginx` ConfigMap generated by this chart. Buffering is off so
# the VNC stream and CDP websockets are passed through as smoothly as
# possible.
nginx:
  image:
    repository: nginxinc/nginx-unprivileged
    pullPolicy: IfNotPresent
    # Pinned -- never `latest`.
    tag: 1.29.3-alpine

  # Port serving the KasmVNC UI (only bound when kasmvnc.enabled).
  kasmvncPort: 8080
  # Port serving the CDP debugger (only bound when chromium.debug.enabled).
  # Must differ from chromium.debuggingPort, which chromium binds on
  # loopback.
  debugPort: 9223

  resources: {}
  securityContext: {}

# Chromium's --user-data-dir (profile, cache, cookies, extensions, ...).
persistence:
  enabled: false
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
