{{- if .Values.kasmvnc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "server-browser.fullname" . }}-kasmvnc
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  type: {{ .Values.kasmvnc.service.type }}
  ports:
    - port: {{ .Values.kasmvnc.service.port }}
      targetPort: kasmvnc
      protocol: TCP
      name: kasmvnc
  selector:
    {{- include "server-browser.selectorLabels" . | nindent 4 }}
{{- end }}
