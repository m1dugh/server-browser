{{- if and .Values.kasmvnc.enabled .Values.kasmvnc.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "server-browser.fullname" . }}-kasmvnc
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.kasmvnc.httpRoute.gatewayName }}
      {{- with .Values.kasmvnc.httpRoute.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      sectionName: {{ .Values.kasmvnc.httpRoute.sectionName }}
  hostnames:
    - {{ .Values.kasmvnc.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "server-browser.fullname" . }}-kasmvnc
          port: {{ .Values.kasmvnc.service.port }}
{{- end }}
