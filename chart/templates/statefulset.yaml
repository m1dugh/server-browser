apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "server-browser.fullname" . }}
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "server-browser.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "server-browser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "server-browser.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fix-user-data-permissions
          image: "{{ .Values.chromium.image.repository }}:{{ .Values.chromium.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chromium.image.pullPolicy }}
          command: ["chown", "-R", "chromium:chromium", "/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: user-data
              mountPath: /data
        {{- if .Values.kasmvnc.enabled }}
        - name: fix-x11-socket-permissions
          image: "{{ .Values.chromium.image.repository }}:{{ .Values.chromium.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chromium.image.pullPolicy }}
          command: ["chmod", "1777", "/tmp/.X11-unix"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: x11-socket
              mountPath: /tmp/.X11-unix
        {{- end }}
      containers:
        - name: chromium
          {{- with .Values.chromium.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.chromium.image.repository }}:{{ .Values.chromium.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chromium.image.pullPolicy }}
          env:
            - name: DEBUGGING_PORT
              value: {{ .Values.chromium.debuggingPort | quote }}
            - name: DISPLAY_WIDTH
              value: {{ .Values.chromium.display.width | quote }}
            - name: DISPLAY_HEIGHT
              value: {{ .Values.chromium.display.height | quote }}
            - name: DISPLAY_DEPTH
              value: {{ .Values.chromium.display.depth | quote }}
            {{- if .Values.kasmvnc.enabled }}
            - name: EXTERNAL_DISPLAY
              value: "1"
            {{- end }}
          {{- with .Values.chromium.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/run/server-browser/ready"]
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            {{- if .Values.kasmvnc.enabled }}
            - name: x11-socket
              mountPath: /tmp/.X11-unix
            - name: x11-auth
              mountPath: /run/server-browser/x11-auth
              readOnly: true
            {{- end }}
            - name: user-data
              mountPath: /data
        {{- if .Values.chromium.debug.enabled }}
        - name: debug-fwd
          {{- with .Values.chromium.debug.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.chromium.debug.image.repository }}:{{ .Values.chromium.debug.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.chromium.debug.image.pullPolicy }}
          args:
            - TCP-LISTEN:{{ .Values.chromium.debuggingPort }},fork,reuseaddr
            - TCP:127.0.0.1:{{ .Values.chromium.debuggingPort }}
          ports:
            - name: debug
              containerPort: {{ .Values.chromium.debuggingPort }}
              protocol: TCP
          {{- with .Values.chromium.debug.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
        {{- if .Values.kasmvnc.enabled }}
        - name: kasmvnc
          {{- with .Values.kasmvnc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.kasmvnc.image.repository }}:{{ .Values.kasmvnc.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.kasmvnc.image.pullPolicy }}
          env:
            - name: NO_VNC_PORT
              value: {{ .Values.kasmvnc.port | quote }}
            - name: VNC_RESOLUTION
              value: "{{ .Values.chromium.display.width }}x{{ .Values.chromium.display.height }}"
            - name: VNC_COL_DEPTH
              value: {{ .Values.chromium.display.depth | quote }}
            - name: XAUTHORITY
              value: /shared/x11-auth/Xauthority
            {{- if .Values.kasmvnc.auth.passwordSecretName }}
            - name: VNC_PW
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kasmvnc.auth.passwordSecretName }}
                  key: {{ .Values.kasmvnc.auth.passwordSecretKey }}
            {{- else if .Values.kasmvnc.auth.password }}
            - name: VNC_PW
              value: {{ .Values.kasmvnc.auth.password | quote }}
            {{- end }}
          ports:
            - name: kasmvnc
              containerPort: {{ .Values.kasmvnc.port }}
              protocol: TCP
          {{- with .Values.kasmvnc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: kasmvnc
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: x11-socket
              mountPath: /tmp/.X11-unix
            - name: x11-auth
              mountPath: /shared/x11-auth
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if .Values.kasmvnc.enabled }}
        - name: x11-socket
          emptyDir: {}
        - name: x11-auth
          emptyDir: {}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: user-data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: user-data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
