apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "server-browser.fullname" . }}
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "server-browser.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "server-browser.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations (include "server-browser.nginxEnabled" .) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "server-browser.nginxEnabled" . }}
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "server-browser.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: fix-user-data-permissions
          image: "{{ .Values.chromium.image.repository }}:{{ .Values.chromium.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chromium.image.pullPolicy }}
          command: ["chown", "-R", "chromium:chromium", "/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: user-data
              mountPath: /data
        {{- if .Values.kasmvnc.enabled }}
        - name: fix-x11-socket-permissions
          image: "{{ .Values.chromium.image.repository }}:{{ .Values.chromium.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chromium.image.pullPolicy }}
          command: ["chmod", "1777", "/tmp/.X11-unix"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: x11-socket
              mountPath: /tmp/.X11-unix
        {{- end }}
      containers:
        - name: chromium
          {{- with .Values.chromium.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.chromium.image.repository }}:{{ .Values.chromium.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.chromium.image.pullPolicy }}
          env:
            - name: DEBUGGING_PORT
              value: {{ .Values.chromium.debuggingPort | quote }}
            - name: DISPLAY_WIDTH
              value: {{ .Values.chromium.display.width | quote }}
            - name: DISPLAY_HEIGHT
              value: {{ .Values.chromium.display.height | quote }}
            - name: DISPLAY_DEPTH
              value: {{ .Values.chromium.display.depth | quote }}
            {{- if .Values.kasmvnc.enabled }}
            - name: EXTERNAL_DISPLAY
              value: "1"
            {{- end }}
          {{- with .Values.chromium.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/run/server-browser/ready"]
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            {{- if .Values.kasmvnc.enabled }}
            - name: x11-socket
              mountPath: /tmp/.X11-unix
            - name: x11-auth
              mountPath: /run/server-browser/x11-auth
              readOnly: true
            {{- end }}
            - name: user-data
              mountPath: /data
        {{- if include "server-browser.nginxEnabled" . }}
        # Single plain-HTTP proxy in front of kasmvnc and the CDP debugger:
        # injects kasmvnc's internal credential and rewrites the debugger's
        # /json/* URLs. Config comes from the <fullname>-nginx ConfigMap.
        - name: nginx
          {{- with .Values.nginx.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.nginx.image.repository }}:{{ required "nginx.image.tag must be set (no latest)" .Values.nginx.image.tag }}"
          imagePullPolicy: {{ .Values.nginx.image.pullPolicy }}
          ports:
            {{- if .Values.kasmvnc.enabled }}
            - name: kasmvnc
              containerPort: {{ .Values.nginx.kasmvncPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.chromium.debug.enabled }}
            - name: debug
              containerPort: {{ .Values.nginx.debugPort }}
              protocol: TCP
            {{- end }}
          {{- with .Values.nginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ ternary "kasmvnc" "debug" (.Values.kasmvnc.enabled | default false) }}
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
        {{- end }}
        {{- if .Values.kasmvnc.enabled }}
        - name: kasmvnc
          {{- with .Values.kasmvnc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.kasmvnc.image.repository }}:{{ .Values.kasmvnc.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.kasmvnc.image.pullPolicy }}
          env:
            - name: NO_VNC_PORT
              value: {{ .Values.kasmvnc.port | quote }}
            - name: VNC_RESOLUTION
              value: "{{ .Values.chromium.display.width }}x{{ .Values.chromium.display.height }}"
            - name: VNC_COL_DEPTH
              value: {{ .Values.chromium.display.depth | quote }}
            - name: XAUTHORITY
              value: /shared/x11-auth/Xauthority
            # Kasm's vnc_startup.sh hard-codes `-sslOnly` and
            # `-interface 0.0.0.0`; VNCOPTIONS comes after them, so appending
            # `-sslOnly=0 -interface 127.0.0.1` makes KasmVNC serve plain
            # HTTP/WS on the pod's loopback only. It is therefore reachable
            # solely through the nginx container, which terminates nothing
            # itself (TLS lives at the gateway) and injects the internal
            # credential below.
            - name: VNCOPTIONS
              value: "-sslOnly=0 -interface 127.0.0.1"
            - name: VNC_PW
              value: {{ include "server-browser.kasmvncPassword" . | quote }}
            # Kasm side services this deployment never uses are switched off
            # to save CPU/memory and log noise, and to avoid listening on
            # ports nothing needs (see AGENTS.md).
            - name: KASM_SVC_SMARTCARD
              value: "0"
            - name: KASM_SVC_AUDIO
              value: "0"
            - name: KASM_SVC_AUDIO_INPUT
              value: "0"
            - name: KASM_SVC_GAMEPAD
              value: "0"
            - name: KASM_SVC_PRINTER
              value: "0"
            - name: KASM_SVC_WEBCAM
              value: "0"
          {{- with .Values.kasmvnc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # KasmVNC is bound to loopback, so a kubelet tcpSocket probe (pod
          # IP) cannot reach it. Probe it through nginx instead: nginx injects
          # the internal credential, so the request is authenticated (a
          # credential-less probe was failing auth every 5s, which blacklisted
          # 127.0.0.1 -- also nginx's source address) and nothing secret is
          # written into the pod spec. -f fails on any HTTP error status.
          readinessProbe:
            exec:
              command:
                - curl
                - -fsS
                - -o
                - /dev/null
                - --max-time
                - "2"
                - http://127.0.0.1:{{ .Values.nginx.kasmvncPort }}/
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: x11-socket
              mountPath: /tmp/.X11-unix
            - name: x11-auth
              mountPath: /shared/x11-auth
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if include "server-browser.nginxEnabled" . }}
        - name: nginx-config
          configMap:
            name: {{ include "server-browser.fullname" . }}-nginx
        {{- end }}
        {{- if .Values.kasmvnc.enabled }}
        - name: x11-socket
          emptyDir: {}
        - name: x11-auth
          emptyDir: {}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: user-data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: user-data
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
