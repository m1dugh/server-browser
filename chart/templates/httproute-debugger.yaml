{{- if and .Values.chromium.debug.enabled .Values.chromium.debug.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "server-browser.fullname" . }}-debugger
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.chromium.debug.httpRoute.gatewayName }}
      {{- with .Values.chromium.debug.httpRoute.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      sectionName: {{ .Values.chromium.debug.httpRoute.sectionName }}
  hostnames:
    - {{ .Values.chromium.debug.httpRoute.hostname | quote }}
  rules:
    # Chromium rejects DevTools HTTP requests whose Host header is not an
    # IP address or localhost.
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: localhost
      backendRefs:
        - name: {{ include "server-browser.fullname" . }}-debugger
          port: {{ .Values.chromium.debug.service.port }}
{{- end }}
