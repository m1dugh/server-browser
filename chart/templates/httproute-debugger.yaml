{{- if .Values.chromium.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "server-browser.fullname" . }}-debugger
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.chromium.httpRoute.gatewayName }}
      {{- with .Values.chromium.httpRoute.gatewayNamespace }}
      namespace: {{ . }}
      {{- end }}
      sectionName: {{ .Values.chromium.httpRoute.sectionName }}
  hostnames:
    - {{ .Values.chromium.httpRoute.hostname | quote }}
  rules:
    - backendRefs:
        - name: {{ include "server-browser.fullname" . }}
          port: {{ .Values.service.debuggingPort }}
{{- end }}
