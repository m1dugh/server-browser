{{- if .Values.chromium.debug.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "server-browser.fullname" . }}-debugger
  labels:
    {{- include "server-browser.labels" . | nindent 4 }}
spec:
  type: {{ .Values.chromium.debug.service.type }}
  ports:
    - port: {{ .Values.chromium.debug.service.port }}
      targetPort: debug
      protocol: TCP
      name: debug
  selector:
    {{- include "server-browser.selectorLabels" . | nindent 4 }}
{{- end }}
