name: Build and push kasmvnc image

on:
  push:
    branches: [main]
    paths:
      - kasmvnc/**
      - .github/workflows/kasmvnc-image.yaml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/kasmvnc

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read kasmvnc version
        id: version
        run: |
          KASM_VERSION="$(cat kasmvnc/version.txt)"
          ALPINE_CODE="$(sed -n 's/^FROM kasmweb\/core-alpine-\([0-9]\{3\}\):\${BASE_TAG}$/\1/p' kasmvnc/Dockerfile)"
          ALPINE_VERSION="${ALPINE_CODE:0:1}.${ALPINE_CODE:1:2}"
          echo "kasm_version=${KASM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${KASM_VERSION}-alpine${ALPINE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: kasmvnc
          file: kasmvnc/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            BASE_TAG=${{ steps.version.outputs.kasm_version }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
